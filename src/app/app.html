<div id="Gallery" class="py-5">
   <div class="container">
      <div class="row row-gap-3">
        <div class="col-lg-4" *ngFor="let img of images;index as i">
          <div class="item">
            <img src="assets/images/{{img}}" class="img-fliud"  >
            <div class="layout">
              <i class="fa-solid fa-square-plus" (click)="openPopup(popup,popupImg,img,i)"></i>
            </div>
          </div>
        </div>
      </div>
   </div>
</div>

<div class="popup" #popup (click)="closePopup()">
  <div class="box" (click)="stopPro($event)">
    <img src="assets/images/img1.jpg" class="img-fluid"  #popupImg>
    <i class="fas fa-times exit" (click)="closePopup()"></i>
    <i class="fas fa-chevron-right next" (click)="nextImg()"></i>
    <i class="fas fa-chevron-left prev" (click)="prevImg()"></i>
    <div class="table-responsive inductor">
        <ul class="list-unstyled d-flex mb-0 column-gap-2">
            <li *ngFor="let img of images;index as i" class="{{indexofCurrentImg == i ?'active':' '}}"  (click)="inductors(i)">{{i+1}}</li>
        </ul>
    </div>
  </div>
</div>
